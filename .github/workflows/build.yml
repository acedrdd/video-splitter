name: Build site and APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install
      - name: Assemble www (page + offline ffmpeg files)
        run: |
          mkdir -p www/vendor
          cp index.html www/
          cp node_modules/@ffmpeg/ffmpeg/dist/ffmpeg.min.js www/vendor/
          cp node_modules/@ffmpeg/core/dist/* www/vendor/
      - uses: actions/upload-artifact@v4
        with:
          name: www
          path: www
      - uses: actions/upload-pages-artifact@v3
        with:
          path: www

  deploy:
    needs: web
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.d.outputs.page_url }}
    steps:
      - id: d
        uses: actions/deploy-pages@v4

  apk:
    needs: web
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: www
          path: www
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - run: npm install
      - run: npx cap add android
      - run: npx cap sync android
      - run: chmod +x android/gradlew
      - run: ./gradlew assembleDebug
        working-directory: android
      - uses: actions/upload-artifact@v4
        with:
          name: VideoSplitter-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
