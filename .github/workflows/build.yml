name: Build site and APK

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install
      - name: Assemble www
        run: |
          mkdir -p www
          cp index.html www/
          cp logo.svg www/
      - uses: actions/upload-artifact@v4
        with:
          name: www
          path: www
      - uses: actions/upload-pages-artifact@v3
        with:
          path: www

  deploy:
    needs: web
    if: ${{ !startsWith(github.ref, 'refs/tags/') }}
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.d.outputs.page_url }}
    steps:
      - id: d
        uses: actions/deploy-pages@v4

  apk:
    needs: web
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: www
          path: www
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - run: npm install
      - run: npx cap add android
      - name: Set the app version
        run: |
          VER="2.0"
          case "$GITHUB_REF" in refs/tags/v*) VER="${GITHUB_REF_NAME#v}" ;; esac
          echo "VER=$VER" >> "$GITHUB_ENV"
          sed -i "s/versionCode [0-9]*/versionCode ${{ github.run_number }}/; s/versionName \"[^\"]*\"/versionName \"$VER\"/" android/app/build.gradle
      - name: Allow notifications on Android 13+
        run: |
          f=android/app/src/main/AndroidManifest.xml
          grep -q POST_NOTIFICATIONS $f || sed -i 's#<application#<uses-permission android:name="android.permission.POST_NOTIFICATIONS" />\n    <application#' $f
      - name: Make app icons from logo.svg
        continue-on-error: true
        run: |
          sudo apt-get update && sudo apt-get install -y librsvg2-bin
          mkdir -p assets
          python3 - <<'PY'
          s = open("logo.svg").read()
          inner = s.split('fill="#181b2c"/>', 1)[1].rsplit("</svg>", 1)[0]
          def svg(bg, art, scale):
              g = '<g transform="translate(256 256) scale(%s) translate(-256 -256)">%s</g>' % (scale, inner) if art else ""
              b = '<rect width="512" height="512" fill="#181b2c"/>' if bg else ""
              return '<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">%s%s</svg>' % (b, g)
          open("assets/icon-only.svg", "w").write(svg(True, True, 0.85))
          open("assets/icon-foreground.svg", "w").write(svg(False, True, 0.62))
          open("assets/icon-background.svg", "w").write(svg(True, False, 1))
          PY
          for f in icon-only icon-foreground icon-background; do rsvg-convert -w 1024 -h 1024 assets/$f.svg -o assets/$f.png; done
          npx --yes @capacitor/assets@3 generate --android
      - run: npx cap sync android
      - run: chmod +x android/gradlew
      - run: ./gradlew assembleDebug
        working-directory: android
      - name: Name the APK
        run: |
          mkdir -p out
          cp android/app/build/outputs/apk/debug/app-debug.apk "out/VideoSplitter-$VER.apk"
          ls -la out
      - uses: actions/upload-artifact@v4
        with:
          name: VideoSplitter-apk
          path: out/*.apk
          if-no-files-found: error

  release:
    needs: apk
    if: ${{ startsWith(github.ref, 'refs/tags/v') }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: VideoSplitter-apk
          path: out
      - uses: softprops/action-gh-release@v2
        with:
          name: Video Splitter ${{ github.ref_name }}
          body_path: RELEASE_NOTES.md
          files: out/*.apk
