name: Build site and APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install
      - name: Assemble www (page + offline ffmpeg files)
        run: |
          mkdir -p www/vendor
          cp index.html www/
          cp logo.svg www/
          cp node_modules/@ffmpeg/ffmpeg/dist/umd/ffmpeg.js node_modules/@ffmpeg/ffmpeg/dist/umd/814.ffmpeg.js www/vendor/
          cp node_modules/@ffmpeg/util/dist/umd/index.js www/vendor/util.js
          cp node_modules/@ffmpeg/core/dist/umd/ffmpeg-core.js node_modules/@ffmpeg/core/dist/umd/ffmpeg-core.wasm www/vendor/
      - uses: actions/upload-artifact@v4
        with:
          name: www
          path: www
      - uses: actions/upload-pages-artifact@v3
        with:
          path: www

  deploy:
    needs: web
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.d.outputs.page_url }}
    steps:
      - id: d
        uses: actions/deploy-pages@v4

  apk:
    needs: web
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: www
          path: www
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - run: npm install
      - run: npx cap add android
      - name: Make app icons from logo.svg
        continue-on-error: true
        run: |
          sudo apt-get update && sudo apt-get install -y librsvg2-bin
          mkdir -p assets
          python3 - <<'PY'
          s = open("logo.svg").read()
          inner = s.split('fill="#181b2c"/>', 1)[1].rsplit("</svg>", 1)[0]
          def svg(bg, art, scale):
              g = '<g transform="translate(256 256) scale(%s) translate(-256 -256)">%s</g>' % (scale, inner) if art else ""
              b = '<rect width="512" height="512" fill="#181b2c"/>' if bg else ""
              return '<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">%s%s</svg>' % (b, g)
          open("assets/icon-only.svg", "w").write(svg(True, True, 0.85))
          open("assets/icon-foreground.svg", "w").write(svg(False, True, 0.62))
          open("assets/icon-background.svg", "w").write(svg(True, False, 1))
          PY
          for f in icon-only icon-foreground icon-background; do rsvg-convert -w 1024 -h 1024 assets/$f.svg -o assets/$f.png; done
          npx --yes @capacitor/assets@3 generate --android
      - run: npx cap sync android
      - run: chmod +x android/gradlew
      - run: ./gradlew assembleDebug
        working-directory: android
      - name: Show APK files
        run: find android -name "*.apk"
      - uses: actions/upload-artifact@v4
        with:
          name: VideoSplitter-apk
          path: android/app/build/outputs/**/*.apk
          if-no-files-found: error
